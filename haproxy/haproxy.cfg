# Updated: September 2026 - Modern SSL/TLS configuration for HAProxy 2.8+
#

global
  # Security and privilege settings
  user haproxy
  group haproxy
  chroot /var/lib/haproxy
  daemon
  quiet
  
  # Logging configuration
  log 127.0.0.1 local0
  log-tag haproxy
  
  # Performance and monitoring
  stats socket /var/lib/haproxy/stats level admin
  maxconn 4096
  pidfile /var/run/haproxy.pid
  tune.bufsize 262144
  
  # --------------------------------------------------------------------------
  # Modern SSL/TLS Configuration (2026)
  # --------------------------------------------------------------------------
  # Generated using Mozilla SSL Configuration Generator v5.7
  # https://ssl-config.mozilla.org/#server=haproxy&version=2.8&config=intermediate&openssl=3.0&guideline=5.7
  # Intermediate configuration - balances compatibility with security
  
  # SSL/TLS protocol and cipher settings for inbound connections
  ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
  ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
  ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11 no-tls-tickets
  ssl-default-bind-curves X25519:secp384r1:secp521r1
  
  # SSL/TLS settings for outbound connections (to backend servers)
  ssl-default-server-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
  ssl-default-server-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
  ssl-default-server-options no-sslv3 no-tlsv10 no-tlsv11 no-tls-tickets
  
  # Diffie-Hellman parameters for perfect forward secrecy
  tune.ssl.default-dh-param 2048
  
  # HSTS (HTTP Strict Transport Security) settings
  # Sets HSTS header with 1-year duration, includes subdomains, and allows preloading
  http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" if { ssl_fc }
defaults
  # Connection timeouts (adjust based on your application needs)
  timeout connect 10s      # Maximum time to wait for connection to backend
  timeout client 30s       # Maximum time to wait for client to send data
  timeout server 30s       # Maximum time to wait for backend to respond
  
  # Logging and monitoring
  log global
  mode http
  
  # Load balancing algorithm
  balance roundrobin
  
  # Logging options
  option httplog           # Enable HTTP logging with detailed format
  option dontlognull       # Don't log connections with no data
  option redispatch        # Allow session redistribution if server fails
  option tcplog            # Enable TCP logging
  
  # HTTP header handling
  option forwardfor if-none # Add X-Forwarded-For header if not present
  
  # Security and error handling
  option accept-invalid-http-request # Accept non-RFC compliant requests
  retries 3                # Number of retries on connection failure
  
  # Health checking (basic TCP check)
  option tcp-check         # Enable TCP health checks
  tcp-check connect port 80 # Check backend on port 80
# -----------------------------------------------------------------------------
# HTTPS Frontend (SSL/TLS Termination)
# -----------------------------------------------------------------------------
# This frontend handles HTTPS connections on port 8443
# SSL/TLS termination happens here, then traffic is forwarded to Apache
frontend dispatcher-https-in
  mode http
  default_backend apache
  bind *:8443 ssl crt /etc/ssl/docker/haproxy.pem alpn h2,http/1.1
  
  # Security headers for HTTPS traffic
  http-response set-header X-Content-Type-Options nosniff
  http-response set-header X-Frame-Options DENY
  http-response set-header X-XSS-Protection "1; mode=block"
  http-response set-header Referrer-Policy strict-origin-when-cross-origin
  
  # Set X-Forwarded-Proto header for backend applications
  http-request set-header X-Forwarded-Proto https if { ssl_fc }

# -----------------------------------------------------------------------------
# HTTP Frontend (Plain Text)
# -----------------------------------------------------------------------------
# This frontend handles HTTP connections on port 8080
# Useful for testing or internal traffic
frontend dispatcher-http-in
  mode http
  default_backend apache
  bind *:8080
  
  # Redirect HTTP to HTTPS (optional - uncomment for production)
  # redirect scheme https code 301 if !{ ssl_fc }

# -----------------------------------------------------------------------------
# Backend Configuration (Apache with Dispatcher)
# -----------------------------------------------------------------------------
backend apache
  # Apache-specific timeout settings
  timeout server 5m  # Allow longer for AEM page rendering
  
  # Health check configuration
  option httpchk GET /content/we-retail/language-masters/en.html
  http-check expect status 200
  
  # Backend server definition
  # server1: Apache running on localhost port 80
  # maxconn: Maximum concurrent connections
  # check: Enable health checks every 5 seconds
  # rise: Number of successful checks before marking server UP
  # fall: Number of failed checks before marking server DOWN
  server server1 127.0.0.1:80 maxconn 256 check inter 5s rise 2 fall 3
